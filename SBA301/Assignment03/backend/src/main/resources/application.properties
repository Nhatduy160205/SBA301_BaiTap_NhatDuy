server.port=8080

# ===================================================================
# 1. DATABASE CONFIGURATION (MS SQL SERVER)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3TranNhatDuy_CE190982;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Điền tài khoản sa và mật khẩu của SQL Server của bạn tại đây:
spring.datasource.username=sa
spring.datasource.password=123456

# ===================================================================
# 2. JPA & HIBERNATE CONFIGURATION
# ===================================================================
# 'update' giúp Spring Data JPA tự động tạo/cập nhật bảng tương ứng với Entity khi chạy ứng dụng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# ===================================================================
# 3. STAFF ACCOUNT CONFIGURATION (Lấy từ application.properties theo đề)
# ===================================================================
hotel.staff.email=staff@fuminihotel.com
hotel.staff.password=Staff@123
hotel.staff.name=Hotel Administrator

# ===================================================================
