# Project: FUNewsManagementSystem Backend Configuration

spring.application.name=FUNewsManagementSystem
server.port=8080

# Database Configuration (MS SQL Server)
# Database Name: A2TranNhatDuy_CE190982
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A2TranNhatDuy_CE190982;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Giữ nguyên chính xác tên bảng và cột hoa/thường theo đúng sơ đồ ERD đề bài
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8
